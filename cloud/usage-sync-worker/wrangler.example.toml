name = "codex-cockpit-sync"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "codex-cockpit-sync"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Set BOOTSTRAP_SECRET using `wrangler secret put`, never here.

# Use namespace IDs unique within your own Cloudflare account. These are not secrets.
# Local-to-edge, approximate limits; not a global billing cap or DDoS guarantee.
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
