name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [UTC, Asia/Shanghai, America/Los_Angeles]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npm run audit:public
      - run: npm run version:check -- --tag "$GITHUB_REF_NAME"
      - run: npm --prefix cloud/usage-sync-worker test
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-universal
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
            label: windows-x64
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    env:
      VITE_RELEASE_URL: https://github.com/${{ github.repository }}/releases
      COCKPIT_UPDATES_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build signed updater packages
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json ${{ matrix.args }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Scan Windows executable and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object FullName)
          if ($installers.Count -eq 0) { throw 'No installer produced' }
          ./scripts/test-defender-scan-output.ps1
          ./scripts/verify-windows-defender.ps1 -Path (@('src-tauri/target/release/quota-float.exe') + $installers) -PrepareGitHubRunner -EnableRealTimeProtection -UpdateSignatures
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/nsis/*.exe.sig
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: updater-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble and publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir packages
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            asset="packages/${name// /.}"
            test ! -e "$asset"
            cp "$file" "$asset"
          done < <(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.sig' -o -name '*.app.tar.gz' \) -print0)
          test "$(find packages -name '*.dmg' | wc -l)" -ge 1
          test "$(find packages -name '*.exe' | wc -l)" -ge 1
          version="${GITHUB_REF_NAME#v}"
          channel=stable
          flags=()
          if [[ "$version" == *-beta.* ]]; then channel=beta; flags+=(--prerelease); fi
          # Existing feeds are never silently moved backwards by a slower build.
          previous=()
          if gh release view "updates-$channel" >/dev/null 2>&1; then
            gh release download "updates-$channel" --pattern latest.json --dir previous
            previous+=(previous/latest.json)
          fi
          node scripts/updater-manifest.mjs packages "$GITHUB_REPOSITORY" "$version" "${previous[@]}"
          (cd packages && sha256sum *.dmg *.exe *.app.tar.gz *.sig > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" packages/* --verify-tag "${flags[@]}" --title "Codex Cockpit $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
          if gh release view "updates-$channel" >/dev/null 2>&1; then
            # Only this manifest pointer is mutable; versioned installers stay intact.
            gh release upload "updates-$channel" packages/latest.json --clobber
          else
            gh release create "updates-$channel" packages/latest.json --target "$GITHUB_SHA" --prerelease --title "自动更新来源 · $channel" --notes "自动更新清单。请到带版本号的 Release 下载安装包。"
          fi
